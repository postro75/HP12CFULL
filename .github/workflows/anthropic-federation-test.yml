name: anthropic-federation-test

# Weryfikuje wymianę tokenu OIDC GitHub -> token Anthropic (Workload Identity
# Federation) oraz GET /v1/models. Nie wywołuje płatnej generacji i nie używa
# stałych kluczy Anthropic. Identyfikatory pochodzą z GitHub Variables (nie sekrety).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: Check variables
        run: |
          for v in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID ANTHROPIC_WORKSPACE_ID; do
            if [ -z "${!v}" ]; then echo "::error::Brak zmiennej $v"; exit 1; fi
          done

      - name: Exchange OIDC token and list models
        run: |
          set -euo pipefail
          JWT=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          echo "::add-mask::$JWT"

          BODY=$(jq -n --arg jwt "$JWT" \
            --arg rule "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg org "$ANTHROPIC_ORGANIZATION_ID" \
            --arg sa "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg ws "$ANTHROPIC_WORKSPACE_ID" \
            '{grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion:$jwt,federation_rule_id:$rule,organization_id:$org,service_account_id:$sa,workspace_id:$ws}')

          code=$(curl -sS -o exchange.json -w '%{http_code}' https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" --data "$BODY")
          echo "Token exchange HTTP: $code"
          if [ "$code" != "200" ]; then
            jq -r '.error // .' exchange.json || true
            exit 1
          fi
          ACCESS_TOKEN=$(jq -r .access_token exchange.json)
          echo "::add-mask::$ACCESS_TOKEN"
          echo "expires_in: $(jq -r .expires_in exchange.json)"
          rm -f exchange.json

          code=$(curl -sS -o models.json -w '%{http_code}' "https://api.anthropic.com/v1/models?limit=5" \
            -H "authorization: Bearer $ACCESS_TOKEN" \
            -H "anthropic-version: 2023-06-01")
          echo "GET /v1/models HTTP: $code"
          if [ "$code" != "200" ]; then
            jq -r '.error // .' models.json || true
            exit 1
          fi
          echo "Models (first 5):"
          jq -r '.data[].id' models.json
